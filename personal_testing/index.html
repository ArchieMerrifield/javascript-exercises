<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Testing</title>
</head>
<body>
    <header>Personal Testing</header>
    <div>Javascript will be run below:</div>

    <script>
        function add7 (number){
            return (number+7)
        }
        function multiply (num1, num2){
            return (num1*num2);
        }
        function capitalize (string){
            //start by making the entire string lower case
            const temp = string.toLowerCase();

            //then raise tha cahracter at position 0 to be upper case
            const char0 = temp.charAt(0).toUpperCase();

            //only necessary for testing
            /*
            console.log(char0);
            console.log(temp.slice(1));
            console.log(char0 + temp.slice(1));
            */

            //using the slice() method, combine the capitalised first letter, and the rest of the string.
            return (char0 + temp.slice(1));
        }
        function lastLetter(string){
            //I think I would have figured it out, but found on w3 schools when looking at string metohds
            return (string.charAt(string.length-1));
        }

        console.log(add7(10));
        console.log(multiply(3,2));
        console.log(capitalize("abcd"));
        console.log(capitalize("ABCD"));
        console.log(capitalize("aBcD"));
        console.log(lastLetter("abcd"));
    </script>
</body>
</html>
